# Notes announced as plugin.updated for the matching plugin.yml version only.
# Never backfill older versions; agents receive the currently running entry.
0.7.5:
  changes:
    - bed lock. A bed or anchor claimed by an agent is locked to that agent; players (ops included) cannot sleep in it or set spawn there, and other agents cannot sleep, claim or set spawn on it
    - op commands accept target names with spaces, either quoted ("Hero Steve") or as an agent display name written out (tp Hero Steve to 0 70 0)
    - op tp never leaves a body inside blocks. If the feet or head cell is solid after the teleport the body moves up to the first two-block air space
    - deep dives finish the last few blocks before surfacing for air unless air is critical (10% or less), and surfacing within 3 blocks of the dive target counts as arrived_near instead of failed
    - fixed agents respawning at world spawn after dying near their claimed bed (fb-51). A claimed bed that still exists and is unobstructed is always the respawn point
  actionsAdded: []
  actionsChanged:
    - op
    - goto
    - sleep
    - set_spawn
0.7.4:
  changes:
    - fixed agents snapping to the seabed and drowning. The idle airborne snap-down treated water as empty air, so a body floating on the surface (or a goto into water) was teleported to the bottom (same_column_air_snap). Any body in or right over water is now never air-snapped
    - swimming stays on the surface by default. Path steps with the head under water cost more, so routes over water swim along the top; idle bodies in water float up instead of sinking
    - agents may still dive when the target or path needs it, but at 30% air or less they swim straight up to breathe and dive again once air is back to 95%. observe navigation shows surfacingForAir while this happens and a nav.surfacing_for_air event is emitted
  actionsAdded: []
  actionsChanged:
    - goto
0.7.3:
  changes:
    - fixed walking over thin snow pausing and glitching on every block. Snow layer collision now matches vanilla, (layers-1)/8, so 1-layer snow counts as air and you stand on the block below. Before, waypoints expected feet at y+0.125, so arrival never fired and stuck/repath ran on each node. Layers 2-8 use their real height in pathing, waypoint y and arrival checks
    - observe includeBlocks now reports layers for SNOW blocks
    - /agentsmc op and deop accept agent names with spaces (e.g. /agentsmc op Intern Steve) and agent ids
  actionsAdded: []
  actionsChanged:
    - observe
0.7.2:
  changes:
    - new op action for console-opped agents (/agentsmc op <agent>, deop <agent>, ops; stored in plugins/AgentsMC/ops.yml). command is one of give, tp, heal, feed, gamemode, time, weather, difficulty, setspawn, clearinv, kill, summon, killmobs, fill, op, deop, ban, pardon, kick, restart with a space-separated args string; non-opped agents get ok:false with the console command to run
    - op targets resolve online players first, then agents by id or display name (Citizens bodies); op/deop/ban/pardon/kick only apply to real players; fill is capped at 32768 blocks and killmobs at radius 64 (hostile only); there is no stop and no raw console command
    - op restart uses the Spigot restart only when spigot.yml settings.restart-script points at an existing file; otherwise it returns "restart is not available on this host"
    - every op action is logged to the server console with agent, command, args and result
    - a successful action-result POST clears the bridge lastError; an action result answered with HTTP 404 is dropped instead of retried every poll
  actionsAdded:
    - op
  actionsChanged: []
0.7.1:
  changes:
    - /agentsmc bridge status and the post-link message show the server PIN and the players' MCP connector URL (<bridge>/api/mcp/<PIN>) when the bridge reports pin/connectUrl; otherwise they point to the Servers dashboard
    - link/unlink help and token-revoked messages name the configured bridge url instead of always the default site
  actionsAdded: []
  actionsChanged: []
0.7.0:
  changes:
    - public release - any server can join the AgentsMC bridge; /agentsmc link <code> claims a link code from the Servers dashboard and stores this server's id and token in bridge.yml
    - /agentsmc unlink removes the stored token; /agentsmc bridge status shows the server id and link state but never the token
    - an unknown or revoked server token (HTTP 401 token_revoked) reports a clear "run /agentsmc link <code>" message instead of retry noise
    - the jar no longer carries any bridge config or agent-name list; spawn defaults to the world spawn and the join message is configurable (join-message in bridge.yml, empty disables)
    - server tokens of the new prefixed format are accepted and are masked in all logs
  actionsAdded: []
  actionsChanged: []
0.6.80:
  changes:
    - fb-37 observe and observe.navigation report the body's live world (plus environment and worldChange); a portal, tp or respawn into another world clears the stale goto target with world_changed, and later steps in a program target the new world
    - fb-38 use_portal (also portal, and usable as a steps program step) walks fully into the nearest nether/end portal block, waits inside for the world change with a timeout (default 20s) and reports world, environment and position; if vanilla does not move the body after ~4.5s the plugin sends it through (vanillaOnly:true disables that)
    - fb-39/fb-40 snow layers, carpets, bottom slabs and other partial-height blocks are walkable floor at their real height; a +1 step from snow to snow no longer reads as a 1.125 hop that stalls the climb, and a jump that needs more than 1.25 of real lift is not planned
    - fb-43 goto prefers ground-level routes near the start/target height over ridges, does not drop into enclosed 1-wide holes on the way to somewhere else, and climbs out of a 1-2 deep hole before planning or when it stalls
    - sleeping bodies get up by themselves at dawn (or whenever beds stop working, outside 12542..23459 without thunder) and stand on a free cell beside the bed (FACING-aware, never inside a block); goto and other wake actions also step out beside the bed instead of standing up sunk into it
    - a lying body is turned with the vanilla bed table (SOUTH 90, WEST 0, NORTH 270, EAST 180) so it no longer lies 90 degrees off when the client has no bed position
    - fb-27 inspect_container on a furnace adds furnace (lit, burnTime, cookTime, cookTimeTotal) and history - the last 12 touches with who did it (agent smelt/fuel/transfer, player clicks and result extraction, hoppers, breaking); smelt notes the result waits in slot 2 for transfer withdraw
  actionsAdded:
