<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentsMC status</title>
    <style>
      :root {
        --bg: #12160f;
        --card: #1c2418;
        --ink: #e8efd8;
        --muted: #9aa88a;
        --line: #33402c;
        --good: #8fce5a;
        --warn: #e0b04a;
        --bad: #d46a4c;
        --accent: #6db3f2;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
      body { padding: 12px; }
      header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 10px; }
      h1 { font-size: 18px; margin: 0; }
      .sub { color: var(--muted); font-size: 12px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
      .wide { grid-column: 1 / -1; }
      .row { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; }
      .k { color: var(--muted); }
      .bar { height: 8px; background: #0d110b; border-radius: 99px; overflow: hidden; margin-top: 4px; }
      .bar > i { display: block; height: 100%; background: var(--good); }
      .bar.warn > i { background: var(--warn); }
      .bar.bad > i { background: var(--bad); }
      button { background: #2a3824; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.primary { background: #35507a; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; }
      ul { margin: 6px 0 0; padding-left: 16px; }
      li { margin: 3px 0; }
      .status { font-weight: 600; }
      .ok { color: var(--good); }
      .err { color: var(--bad); }
      select, input { background: #0d110b; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
      @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 id="name">Agent</h1>
        <div class="sub" id="meta">Waiting for host data…</div>
      </div>
      <div class="actions">
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <div class="grid">
      <section class="card">
        <div class="row"><span class="k">Health</span><span id="health">—</span></div>
        <div class="bar" id="healthBar"><i style="width:0%"></i></div>
        <div class="row"><span class="k">Food</span><span id="food">—</span></div>
        <div class="bar" id="foodBar"><i style="width:0%"></i></div>
      </section>
      <section class="card">
        <div class="row"><span class="k">Position</span><span id="pos">—</span></div>
        <div class="row"><span class="k">World</span><span id="world">—</span></div>
        <div class="row"><span class="k">Dimension</span><span id="dimension">—</span></div>
        <div class="row"><span class="k">Spawned</span><span id="spawned">—</span></div>
      </section>
      <section class="card wide">
        <div class="row"><span class="k">Action</span><span id="action" class="status">—</span></div>
        <div class="row"><span class="k">Navigation</span><span id="nav">—</span></div>
        <div class="actions" style="margin-top:8px">
          <button id="stop" type="button">Stop</button>
          <button id="follow" class="primary" type="button">Follow</button>
          <button id="come" class="primary" type="button">Come</button>
          <select id="player"></select>
        </div>
        <div class="sub" id="note"></div>
      </section>
      <section class="card">
        <div class="k">Inventory</div>
        <div id="invLabel" class="sub">—</div>
        <ul id="inv"></ul>
      </section>
      <section class="card">
        <div class="k">Recent events</div>
        <ul id="events"></ul>
      </section>
    </div>
    <script type="module" src="./src/mcp-app.js"></script>
  </body>
</html>
